<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Verify</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.1);
width:90%;
max-width:420px;
text-align:center;
}

h1{
color:#003b8e;
margin-bottom:10px;
}

p{
color:#666;
}

input{
width:100%;
padding:12px;
margin-top:20px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#003b8e;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#002d6b;
}

.footer{
margin-top:20px;
font-size:13px;
color:#777;
}
</style>

</head>

<body>

<div class="card">

<h1>JR VERIFY</h1>

<p>
Plateforme officielle de vérification des certificats
de JR Créations
</p>

<input
type="text"
placeholder="Exemple : JR-2026-0001">

<button>
Vérifier le certificat
</button>

<div class="footer">

© JR Créations

</div>

</div>

</body>
</html>
