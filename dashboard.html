<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>JR Créations Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0B3D91;
}

input{
width:100%;
padding:12px;
margin:15px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0B3D91;
color:#fff;
}

tr:nth-child(even){
background:#f2f2f2;
}
</style>

</head>

<body>

<div class="container">

<h1>Dashboard JR Créations</h1>

  <button onclick="logout()" style="background:red;color:white;padding:10px 15px;border:none;border-radius:8px;cursor:pointer;float:right;">
🚪 Déconnexion
</button>

<input
type="text"
id="search"
placeholder="Rechercher par nom..."
onkeyup="filtrer()">

<table id="tableau">

<thead>
<tr>
<th>ID</th>
<th>Nom</th>
<th>Formation</th>
<th>Date</th>
<th>Lieu</th>
<th>Statut</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

<script>
  if(localStorage.getItem("jr_admin")!=="true"){
    window.location.href="login.html";
}

const API="https://script.google.com/macros/s/AKfycbzMJvnHnBrx4V11GhZh2As-5jEh9ZYl4kRChayRXszsw3HvfNU62G9vIALqPUHMd9nD/exec";

async function chargerEtudiants(){

  const rep = await fetch(API + "?action=list");
  const data = await rep.json();

  const tbody = document.getElementById("tbody");
tbody.innerHTML = "";

data.forEach(eleve => {

  tbody.innerHTML += `
    <tr>
      <td>${eleve.id}</td>
      <td>${eleve.nom}</td>
      <td>${eleve.formation}</td>
      <td>${eleve.date}</td>
      <td>${eleve.lieu}</td>
      <td>${eleve.statut}</td>
      <td>
        <button onclick="modifier('${eleve.id}')">✏️</button>
        <button onclick="supprimer('${eleve.id}')">🗑️</button>
      </td>
    </tr>
  `;

});

}  
  function filtrer(){

  let input=document.getElementById("search").value.toLowerCase();
  let lignes=document.querySelectorAll("#tbody tr");

  lignes.forEach(ligne=>{

    let nom=ligne.cells[1].innerText.toLowerCase();

    ligne.style.display=nom.includes(input)?"":"none";

  });

}

window.onload = chargerEtudiants;

  function logout(){

    localStorage.removeItem("jr_admin");

    window.location.href="login.html";

}

  function modifier(id){
  alert("Modification de : " + id);
}

function supprimer(id){

  if(confirm("Supprimer cet élève ?")){
    alert("Suppression de : " + id);
  }

}
</script>

</body>
</html>
