 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>JR Créations Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
margin:0;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0B3D91;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#0B3D91;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#082d6b;
}

#message{
margin-top:20px;
font-weight:bold;
text-align:center;
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="container">

<h1>JR Créations Admin</h1>

<input id="nom" placeholder="Nom complet">

<input id="formation" placeholder="Formation">

<input id="date" placeholder="Date">

<input id="lieu" placeholder="Lieu">

<input id="statut" value="Validé (e)">

<input id="messageText" placeholder="Message">


<input id="certificat" placeholder="Lien Certificat PDF">

<button id="btnSave" onclick="ajouterEleve()">
Ajouter l'élève
</button>

 <div id="qrcode" style="margin-top:20px;text-align:center;"></div>

<br>

<a id="downloadQR"
style="display:none;
background:#0B3D91;
color:white;
padding:12px 20px;
border-radius:10px;
text-decoration:none;">
📥 Télécharger le QR Code
</a>

<div id="message"></div>

</div>

<script>

 if(localStorage.getItem("jr_admin")!=="true"){
    window.location.href="login.html";
}

const API="https://script.google.com/macros/s/AKfycbzMJvnHnBrx4V11GhZh2As-5jEh9ZYl4kRChayRXszsw3HvfNU62G9vIALqPUHMd9nD/exec";

async function ajouterEleve(){

const editId = localStorage.getItem("edit_id");

const data={

action: editId ? "update" : "add",

id: editId,

nom:document.getElementById("nom").value,
formation:document.getElementById("formation").value,
date:document.getElementById("date").value,
lieu:document.getElementById("lieu").value,
statut:document.getElementById("statut").value,
message:document.getElementById("messageText").value,

certificat:document.getElementById("certificat").value

};
const rep=await fetch(API,{

method:"POST",

body:JSON.stringify(data)

});

const resultat = await rep.json();

if(data.action=="update"){

  document.getElementById("message").innerHTML =
  "✅ Élève modifié avec succès.";

  localStorage.removeItem("edit_id");

setTimeout(() => {

  window.location.href = "dashboard.html";

},1000);

}else{

  document.getElementById("message").innerHTML =
  resultat.message + "<br><br><b>ID :</b> " + resultat.id;

}

 document.getElementById("nom").value="";
document.getElementById("formation").value="";
document.getElementById("date").value="";
document.getElementById("lieu").value="";
document.getElementById("statut").value="Validé (e)";
document.getElementById("messageText").value="";
document.getElementById("certificat").value="";

 setTimeout(() => {
  document.getElementById("message").innerHTML = "";
}, 5000);
}

 const editId = localStorage.getItem("edit_id");

if(editId){

  document.querySelector("h1").innerHTML = "✏️ Modifier un élève";

  document.getElementById("btnSave").innerHTML = "💾 Enregistrer les modifications";

}

async function chargerEleve(){

  const editId = localStorage.getItem("edit_id");

  if(!editId) return;

  const rep = await fetch(API + "?action=getStudent&id=" + editId);

  const eleve = await rep.json();

  if(!eleve.success) return;

  document.getElementById("nom").value = eleve.nom;
  document.getElementById("formation").value = eleve.formation;
  document.getElementById("date").value = eleve.date;
  document.getElementById("lieu").value = eleve.lieu;
  document.getElementById("statut").value = eleve.statut;
  document.getElementById("messageText").value = eleve.message;
 
  document.getElementById("certificat").value = eleve.certificat;

}

chargerEleve();
 
</script>

</body>
</html>
